[build-system] # Require setuptool version due to https://github.com/pypa/setuptools/issues/2938
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ambit-fe"
version = "v2026.1.0"
description = "A FEniCS-based cardiovascular multi-physics solver"
authors = [{name = "Marc Hirschvogel", email = "marc.hirschvogel@ambit.net"}]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = [
    "finite elements",
    "solid mechanics",
    "fluid mechanics",
    "fluid-solid interaction",
    "fsi",
    "0D models",
    "3D-0D coupling",
    "monolithic",
    "lumped-parameter models",
    "model reduction",
    "heart",
    "circulation",
    "cardiac"
]
dependencies = [
    "mpmath",
    "sympy",
    "scipy",
    "gmsh",
    "h5py",
    "pytest"
]

[tool.pytest.ini_options]
markers = [
    "ale",
    "flow0d",
    "fluid",
    "fluid_ale",
    "fluid_ale_constraint",
    "fluid_ale_flow0d",
    "fluid_constraint",
    "fluid_flow0d",
    "fluid_phasefield",
    "fluid_solid",
    "fsi",
    "fsi_flow0d",
    "frsi",
    "phasefield",
    "rom",
    "signet",
    "solid",
    "solid_constraint",
    "solid_flow0d",
]

[project.urls]
"Homepage" = "https://github.com/marchirschvogel/ambit"
"Bug Tracker" = "https://github.com/marchirschvogel/ambit/issues"

[tool.ruff]
line-length = 120

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 72
